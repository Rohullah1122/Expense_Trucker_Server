<!DOCTYPE html>
<html>
<head><title>Reset Your Password</title></head>
<body>
    <div style="max-width: 400px; margin: 50px auto; font-family: sans-serif;">
        <h2>Create New Password</h2>
        <p id="status"></p>
        <input type="password" id="newPass" placeholder="New Password" style="width:100%; padding:10px; margin:10px 0;">
        <button onclick="submitReset()" style="width:100%; padding:10px; background: #28a745; color:white; border:none;">Update Password</button>
    </div>

<script>
    async function submitReset() {
        // 1. Get the token from the URL (?token=xyz)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        // 2. Get the new password from the input
        const newPassword = document.getElementById('newPass').value;

        if (!newPassword) {
            alert("Please enter a password");
            return;
        }

        // 3. FIX: Match the route name '/reset-password' and body key 'newPassword'
        const res = await fetch('/api/users/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword }) // 'newPassword' must match backend
        });

        const data = await res.json();
        
        // Display success or error message
        const statusElement = document.getElementById('status');
        statusElement.innerText = data.message || data.error;
        statusElement.style.color = res.ok ? "green" : "red";

        if(res.ok) {
            document.querySelector('button').style.display = 'none';
            document.getElementById('newPass').style.display = 'none';
        }
    }
</script>
</body>
</html>
